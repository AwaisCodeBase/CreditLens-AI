[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlens"
version = "0.1.0"
description = "Transaction schema and read-only profiler, plus the labeled credit-card contract and its read-only profiler."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["xlrd>=2.0.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
